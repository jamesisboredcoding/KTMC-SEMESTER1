<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./dist/css/style.css">
    <link rel="shortcut icon" href="./dist/img/fav.ico" type="image/x-icon">
    <title>ChatAI</title>
</head>
<body>
    <main class="flex h-screen">
        <!-- Sidebar -->
        <section class="sidebar bg-zinc-900 h-full relative extended pt-2 flex flex-col select-none">
            <!-- Topbar -->
            <h1 class="text-zinc-50 font-serif text-2xl font-medium mb-4 px-4">ChatAI</h1>
            <button class="sidebar-button sidebar-opt text-zinc-500 aspect-square text-lg w-8 h-8 absolute">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <!-- Buttons -->
            <ul class="buttons px-2">
                <li class="w-full h-8 text-md font-sans">
                    <a id="new-chat" class="sidebar-opt h-full w-full rounded-lg block text-sm/8" href="#">New Chat</a>
                </li>
                <li class="w-full h-8 text-md font-sans">
                    <a id="chats" class="sidebar-opt h-full w-full rounded-lg block text-sm/8" href="#">Chats</a>
                </li>
            </ul>

            <!-- Chats -->
            <ul class="chats w-full grow mt-4">
                <p class="pholder text-zinc-400/70 text-center text-sm mt-10">Your chats will show up here</p>
            </ul>

            <!-- Profile Bar -->
            <div class="profile relative w-full h-16 border-t border-t-zinc-700 p-3.5 flex flex-row items-center">
                <h2 class="icon text-zinc-900 text-center font-serif font-medium w-9 text-xl/9 bg-zinc-300 rounded-full aspect-square">J</h2>
                <div class="info flex flex-col mx-3">
                    <p class="text-zinc-300 text-sm">Guest</p>
                    <p class="text-zinc-400 text-xs">Free Plan</p>
                </div>

                <!-- Popup -->
                <div class="popup absolute left-0 bottom-18 w-full px-2">
                    <div class="container bg-zinc-800 w-full h-full rounded-xl border border-zinc-500 p-2">
                        <p class="text-zinc-500 text-sm px-1">example@gmail.com</p>
                        <ul class="buttons mt-3">
                            <li class="w-full h-8 text-md font-sans">
                                <a id="settings" class="sidebar-opt h-full w-full rounded-lg block text-sm/8" href="#">Settings</a>
                            </li>
                            <li class="w-full h-8 text-md font-sans">
                                <a id="plan" class="sidebar-opt h-full w-full rounded-lg block text-sm/8" href="#">Upgrade Plan</a>
                            </li>
                            <li class="w-full h-8 text-md font-sans">
                                <a id="info" class="sidebar-opt h-full w-full rounded-lg block text-sm/8" href="https://github.com/jamesisboredcoding/KTMC-SEMESTER1">Github Repo</a>
                            </li>
                            <hr class="text-zinc-500/50 my-2">
                            <li class="w-full h-8 text-md font-sans">
                                <a id="logout" class="sidebar-opt h-full w-full rounded-lg block text-sm/8" href="#">Log Out</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <!-- Main Window -->
        <section class="main-window grow relative h-full border-l inited border-l-zinc-700 flex justify-center">
            <div class="messages absolute pt-10 w-full px-[17%] top-0 overflow-scroll h-11/12 pb-20">
                <div data-role="user" class="message">
                    <p>write in markdown</p>
                </div>
                <div data-role="assistant" class="message">
                    <div class="thinking text-zinc-500"></div>
                    <i class="text-zinc-400/50 mb-2 think-status hidden">Thought for 3 seconds</i>
                    <div class="content"></div>
                </div>
            </div>
            <div class="message-container w-2/3">
                <h1 class="text-zinc-50 text-center text-3xl select-none greeting font-serif">How can I help you today?</h1>
                <div class="message-box w-full bg-zinc-800 rounded-3xl px-4 py-2 mt-10">
                    <textarea class="text-zinc-50 resize-none py-3 h-3 min-h-6 max-h-50 px-1 w-full" style="height: 1.5rem;" placeholder="Ask anything"></textarea>
                    <div class="buttons w-full mt-2 h-10 bg-amber-300/0">
                        <ul class="flex flex-row gap-1">
                            <li><button id="attach" class="inline-block w-8 text-zinc-500 rounded-lg aspect-square"><i class="fa-solid fa-plus"></i>
                                <span class="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-zinc-950 text-zinc-50 text-xs rounded-lg py-1 w-20">Attach files</span>
                            </button></li>
                            <li><button id="think" class="can-select inline-block w-8 rounded-lg aspect-square selected"><i class="fa-solid fa-repeat"></i>
                                <span class="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-zinc-950 text-zinc-50 text-xs rounded-lg py-1 w-20">Thinking</span>
                            </button></li>
                            <div class="seperator grow"></div>
                            <button id="send" class="inline-block w-8 rounded-lg aspect-square bg-blue-500 text-zinc-50 disabled:opacity-40"><i class="fa-solid fa-arrow-up"></i></button>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Quick JS -->
    <script>
        const txt = document.querySelector(".message-box textarea")
        function autogrow() {
            txt.style.height = '0px'; txt.style.height = txt.scrollHeight + 'px'
        }
        txt.addEventListener("input", autogrow)
        autogrow(txt)
    </script>

    <!-- JS -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
