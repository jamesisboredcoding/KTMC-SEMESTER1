<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="shortcut icon" href="./img/icon.png" type="image/x-icon">
    <title>Filmflix</title>
</head>
<body>
    <header class="header h-15 border-b border-b-primary/20 flex items-center row fixed w-screen">
        <img class="h-full py-2 ml-8" src="./img/icon.png" alt="">
        <h1 class="text-3xl text-primary font-semibold font-display">Filmflix</h1>
        <div class="navbar absolute h-full w-full flex justify-center">
            <div class="buttons h-full">
                <button class="nav-item selected">Home</button>
                <button class="nav-item">Movies</button>
                <button class="nav-item">TV Shows</button>
            </div>
        </div>
    </header>
    <main class="absolute w-full -z-1">
        <section class="hero backdrop relative w-full h-150 bg-cover bg-center">
            <div class="hero-info absolute bottom-20 left-20">
                <h1 class="text-primary font-black text-6xl text-shadow-lg/40">Stranger Things</h1>
                <div class="info-content flex row gap-5 my-5">
                    <p class="stars text-amber-300 font-bold">6.7</p>
                    <p class="text-primary">2025</p>
                    <p class="movie text-primary">Movie</p>
                </div>
                <p class="desc text-primary w-1/2 text-shadow-lg">Lorem ipsum dolor sit amet consectetur adipisicing elit. Impedit accusamus id aspernatur distinctio facere minima similique ab numquam ad quae maiores cumque, incidunt amet recusandae.</p>
                <div class="buttons mt-5">
                    <button class="play-button">Play</button>
                    <button class="info-button">More Info</button>
                </div>
            </div>
        </section>
        <section class="w-full py-8 px-12">
            <article class="w-full">
                <h1 class="text-primary font-bold text-3xl mb-8">Continue Watching</h1>
                <div class="list">
                    <div class="item w-60 h-90 group hover:scale-105 cursor-pointer transition-transform relative">
                        <img class="rounded-lg h-full w-full absolute" src="https://mbpimages.chuaxin.com/uploadimg/tv/2019/04/11/2019041114140461318.jpg" alt="">
                        <div class="info absolute z-10 bottom-5 left-5 opacity-0 group-hover:opacity-100 group-hover:transition-opacity transition-opacity">
                            <h1 class="text-primary font-bold text-2xl">Zootopia 2</h1>
                            <div class="flex row gap-3">
                                <p class="stars text-amber-300 font-bold">6.7</p>
                                <p class="text-primary">2025</p>
                            </div>
                        </div>
                        <div class="progress bg-surface/70 w-full rounded-b-lg h-2 absolute bottom-0">
                            <div class="slider w-10/12 h-full bg-accent rounded-b-lg"></div>
                        </div>
                    </div>
                </div>
            </article>
        </section>
    </main>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
