<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./dist/css/style.css">
    <link rel="icon" href="./dist/img/fav.ico" type="image/x-icon">
    <title>ChatAI</title>
</head>
<body>
    <main class="flex h-screen">
        <!-- Sidebar -->
        <section class="sidebar bg-zinc-900 md:extended h-screen pt-2 flex flex-col select-none z-10 border-r border-b border-b-zinc-700 border-r-zinc-700">
            <!-- Topbar -->
            <h1 class="text-zinc-50 font-serif text-2xl font-medium mb-4 px-4">ChatAI</h1>
            <div class="w-full relative">
                <button class="sidebar-button sidebar-opt text-zinc-500 aspect-square rounded-lg text-lg w-8 h-8 absolute">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Buttons -->
            <ul class="buttons px-2">
                <li class="w-full h-8 text-md font-sans">
                    <a id="new-chat" class="sidebar-opt h-full rounded-lg block" href="/">New Chat</a>
                </li>
                <li class="w-full h-8 text-md font-sans flex">
                    <a id="git" class="sidebar-opt h-full rounded-lg block" href="https://github.com/jamesisboredcoding/KTMC-SEMESTER1">Github Repo</a>
                </li>
                <li class="w-full h-8 text-md font-sans flex">
                    <button id="settings" class="sidebar-opt h-full rounded-lg block">Settings</button>
                </li>
            </ul>
            <hr class="text-zinc-600 my-3">

            <!-- Chats -->
            <ul class="chats w-full grow px-2 overflow-scroll">
                <p class="text-zinc-500 text-sm px-2 mb-2">Chats</p>
                <a id="chat-example" class="hidden sidebar-opt h-8 w-full rounded-lg block px-2 text-sm/8 truncate" href="#">lorem50</a>
                <p class="pholder text-zinc-400/70 text-center text-sm mt-10 relative">Your chats will show up here</p>
            </ul>
        </section>

        <!-- Main Window -->
        <section class="main-window grow relative h-screen flex justify-center"> <!--inited-->
            <div class="controller px-1 flex-row justify-end items-center bg-zinc-900 border-b border-b-zinc-600 h-10 z-2 w-full fixed top-0 left-0">
                <button id="rename" class="h-8 button text-xs px-3 rounded-lg flex justify-center items-center"><i class="fa-solid pr-3 fa-pen text-xs"></i>Rename Chat</button>
                <button id="delete" class="h-8 button text-xs px-3 rounded-lg flex justify-center items-center"><i class="fa-solid pr-3 fa-trash text-xs"></i>Delete Chat</button>
            </div>
            <div class="messages absolute pt-10 w-full px-[9%] md:px-[17%] top-0 overflow-x-hidden overflow-y-scroll h-11/12 pb-20">
                <div data-role="assistant" class="message">
                    <i class="text-zinc-400/50 mb-2 think-status hidden">Thought for 3 seconds</i>
                </div>
            </div>
            <div class="message-container w-5/6 md:w-2/3 transition-transform">
                <h1 class="text-zinc-50 text-center text-3xl select-none greeting font-serif">How can I help you today?</h1>
                <div class="message-box w-full bg-zinc-800 rounded-3xl px-4 py-2 mt-10">
                    <div class="files flex flex-row gap-1 w-full overflow-hidden">
                        <div id="file-template" class="file hidden bg-zinc-700 flex items-center rounded-lg border border-zinc-600 h-12 w-30 hover:w-auto relative text-zinc-50">
                            <i class="fa-regular fa-file text-xl pl-3"></i>
                            <div class="info truncate">
                                <p class="file-name px-3 select-none truncate">filelarge.txt</p>
                                <p class="file-size px-3 text-xs pb-1 select-none truncate">1.24 KB</p>
                            </div>
                            <button class="file-remove absolute hover:cursor-pointer top-1 right-1 text-sm hover:text-red-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                    <textarea class="text-zinc-50 resize-none py-3 h-3 min-h-6 max-h-50 px-1 w-full" style="height: 1.5rem;" placeholder="Ask anything"></textarea>
                    <div class="buttons w-full mt-2 h-10 bg-amber-300/0">
                        <ul class="flex flex-row gap-1">
                            <li><button id="attach" class="inline-block w-8 text-zinc-500 rounded-lg aspect-square"><i class="fa-solid fa-plus"></i>
                                <span class="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-zinc-950 text-zinc-50 text-xs rounded-lg py-1 w-20">Attach files</span>
                            </button></li>
                            <li><button id="think" class="can-select inline-block w-8 rounded-lg aspect-square"><i class="fa-solid fa-repeat"></i>
                                <span class="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-zinc-950 text-zinc-50 text-xs rounded-lg py-1 w-20">Thinking</span>
                            </button></li>
                            <div class="seperator grow"></div>
                            <button disabled id="send" class="inline-block w-8 rounded-lg aspect-square bg-blue-500 text-zinc-50"><i class="fa-solid fa-arrow-up"></i></button>
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <!-- Global -->
        <div class="absolute-container absolute h-screen w-screen top-0 left-0">
            <div id="rename" class="modal w-100 inactive">
                <label class="truncate text-sm text-zinc-400">Rename 'Untititled' chat</label><br>
                <input type="text" maxlength="45" placeholder="New chat name here..." class="focus:outline-0 my-2 placeholder:text-zinc-400 text-zinc-50 w-full">
                <button id="confirm" class="button rounded-lg px-3 py-1"><i class=" text-xs pr-5 fa-solid fa-pen"></i>Rename</button>
                <button id="cancel" class="button rounded-lg px-3 py-1"><i class=" text-xs pr-5 fa-solid fa-xmark"></i>Cancel</button>
            </div>
            <div id="confirm-delete" class="modal w-100 inactive">
                <p class="text-sm text-zinc-400 mb-2">Are you sure you want to delete 'Untitled'? This action is <span class="text-red-500">irreversible</span> and cannot be undone.</p>
                <button id="confirm" class="button rounded-lg px-3 py-1"><i class="text-xs pr-5 fa-solid fa-trash"></i>Delete</button>
                <button id="cancel" class="button rounded-lg px-3 py-1"><i class="text-xs pr-5 fa-solid fa-xmark"></i>Cancel</button>
            </div>
            <div id="settings" class="modal w-100 inactive">
                <label class="text-sm text-zinc-400">AI Model:</label><br>
                <select class="bg-zinc-800 border border-zinc-500 hover:bg-zinc-700 my-2 rounded-lg px-2 py-1 text-zinc-50">
                    <option value="kimi">Kimi-K2</option>
                    <option value="gpt">GPT-OSS</option>
                    <option value="qwen">Qwen3</option>
                </select><br>
                <hr class="text-zinc-700">
                <label class="text-sm text-zinc-400">Custom Instructions:</label><br>
                <textarea maxlength="200" type="text" rows="5" placeholder="You are a professional finance advisor..." class="focus:outline-0 resize-none my-2 border border-zinc-600 rounded-lg px-3 py-2 placeholder:text-zinc-400 text-zinc-50 w-full"></textarea>
                <hr class="text-zinc-700 mb-2">
                <button id="confirm" class="button rounded-lg px-3 py-1"><i class="fa-solid pr-5 fa-floppy-disk"></i>Save</button>
                <button id="cancel" class="button rounded-lg px-3 py-1"><i class="text-xs pr-5 fa-solid fa-xmark"></i>Cancel</button>
            </div>
        </div>

        <!-- Meta elements -->
        <input type="file" accept=".txt, .csv, .js, .json, .html, .css, .md, .xml, .log, .yml, .yaml" class="hidden" id="file-attach">
    </main>

    <!-- Quick JS -->
    <script>
        const txt = document.querySelector(".message-box textarea")
        function autogrow() {
            txt.style.height = '0px'; txt.style.height = txt.scrollHeight + 'px'
        }
        txt.addEventListener("input", autogrow)
        autogrow(txt)
    </script>

    <!-- JS -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
